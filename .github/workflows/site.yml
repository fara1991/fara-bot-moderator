name: Site

# FaraBotModerator の紹介サイト（site/）。
#   master  → https://twitch-bot.fara-labs.com      （本番）
#   develop → https://twitch-bot-dev.fara-labs.com  （確認用。Cloudflare Access で自分だけが見られる）
# PR では書き出し（ビルド）だけ行い、デプロイはしない。

on:
  push:
    branches: [master, develop]
    paths:
      - "site/**"
      - "Manual.md"
      - "global.json"
      - ".github/workflows/site.yml"
      - ".github/scripts/**"
      - ".gitmodules"
      - "external/fara-site-kit"
  pull_request:
    paths:
      - "site/**"
      - "Manual.md"
      - "global.json"
      - ".github/workflows/site.yml"
      - ".github/scripts/**"
      - ".gitmodules"
      - "external/fara-site-kit"
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE_MODE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開され、メンテナンス画面にもならない）"
        type: boolean
        default: false
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: site
        run: dotnet build FaraBotModeratorSite.sln -c Release --nologo

      - name: Test
        working-directory: site
        run: |
          dotnet test tests/FaraBotModeratorSite.Content.Tests -c Release --no-build --nologo
          dotnet test tests/FaraBotModeratorSite.Shared.Tests -c Release --no-build --nologo
          dotnet test tests/FaraBotModeratorSite.Web.Tests -c Release --no-build --nologo

      - name: Node tests (worker and page scripts)
        working-directory: site
        run: |
          node --test worker/index.test.mjs tests/js/site-init.test.mjs
          node --test ../external/fara-site-kit/worker/report.test.mjs ../external/fara-site-kit/worker/maintenance.test.mjs

      - name: Deploy gate test
        run: node --test .github/scripts/require-maintenance.test.mjs

      # 公開物（Blazor WebAssembly + 本文入りの静的 HTML + _headers）を作る。本番（master）は本番のホストの canonical、それ以外は確認用のホスト
      - name: Build site (publish/wwwroot)
        working-directory: site
        run: node tools/build-site.mjs --env ${{ github.ref_name == 'master' && 'production' || 'develop' }}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/publish/wwwroot
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    # PR では build だけ行い、master / develop への push（と手動実行）でデプロイする。
    # 手動実行は master / develop を選んだときだけ（ほかのブランチで確認用サイトを上書きしない）
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'develop' }}
      url: ${{ github.ref_name == 'master' && 'https://twitch-bot.fara-labs.com' || 'https://twitch-bot-dev.fara-labs.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/publish/wwwroot

      # 確認用（develop）が検索結果に載らないようにする（ポケモンのサイトと同じ。kit の build-pages も X-Robots-Tag: noindex を付けるが、従来どおり nofollow も付けるため、ここで追記する）
      - name: Add noindex header (develop)
        if: github.ref_name != 'master'
        run: |
          cat >> site/publish/wwwroot/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow
          HEADERS

      # 本番（master）の公開は、Cloudflare の Worker の変数 MAINTENANCE_MODE が notice（更新予定のお知らせを出している）のときだけ行う。
      # 確認できないとき・notice でないときは、ここで止める（手動実行の skip_maintenance_check で飛ばせる）。確認用（develop）は確認しない。
      # mode に true / notice / false のどれかを指定した手動実行は、操作した人の意思なので、確認を飛ばす
      - name: Require MAINTENANCE_MODE=notice (production)
        if: ${{ github.ref_name == 'master' && !contains(fromJSON('["true","notice","false"]'), inputs.maintenance_mode) }}
        run: node .github/scripts/require-maintenance.mjs fara-twitch-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}

      # 入力はシェルに直接埋め込まず、環境変数で受ける。空の入力には --var を付けない（keep_vars で現在の値が保持される）。
      # 本番（production）の分岐: mode を指定 → その値 / push と、何も指定しない手動実行 → 公開と同時に MAINTENANCE_MODE:true（メンテナンス画面。作業が終わったら
      # Cloudflare か Run workflow で false に戻す。skip_maintenance_check のときは付けない）/ message だけの手動実行 → MAINTENANCE_MODE は渡さない。
      # 確認用（dev）は、入力したものだけを渡す（push では何も渡さない）。--env の式は従来どおり
      - name: Deploy to Cloudflare Workers
        shell: bash
        working-directory: site
        run: |
          vars=()
          if [ -n "$MAINTENANCE_MODE_INPUT" ]; then
            vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT")
          elif [ "$DEPLOY_ENV" = "production" ] && [ -z "$MAINTENANCE_MESSAGE_INPUT" ] && [ "$SKIP_MAINTENANCE_CHECK" != "true" ]; then
            vars+=(--var "MAINTENANCE_MODE:true")
          fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx wrangler@4.149.0 deploy --env "$DEPLOY_ENV" "${vars[@]}"
        env:
          DEPLOY_ENV: ${{ github.ref_name == 'master' && 'production' || 'dev' }}
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 公開の結果（設定した値と、反映後の現在値）をジョブサマリーに出す。公開が失敗したときも出す
      - name: Summary (maintenance)
        if: ${{ always() }}
        shell: bash
        run: |
          msg="$(printf '%s' "$MAINTENANCE_MESSAGE_INPUT" | tr '`' '"')"
          {
            echo "### メンテナンス表示 (${WORKER_NAME})"
            echo "- 設定した値: MAINTENANCE_MODE=\`${MAINTENANCE_MODE_INPUT:-(変更なし)}\` / MAINTENANCE_MESSAGE=\`${msg:-(変更なし)}\`"
            node -e '
              const j = (v) => JSON.stringify(v);
              fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}/settings`, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } })
                .then((r) => r.json())
                .then((b) => {
                  const list = b?.result?.bindings ?? [];
                  const v = (n) => { const x = list.find((y) => y.name === n); return x ? (x.type === "plain_text" ? j(x.text).replaceAll("`", "\u0027") : `(${x.type})`) : "(未設定)"; };
                  console.log(`- 反映後の現在値: MAINTENANCE_MODE=\`${v("MAINTENANCE_MODE")}\` / MAINTENANCE_MESSAGE=\`${v("MAINTENANCE_MESSAGE")}\``);
                })
                .catch(() => console.log("- 反映後の現在値: 取得できませんでした"));
            '
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: ${{ github.ref_name == 'master' && 'fara-twitch-bot' || 'fara-twitch-bot-dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
