name: Deploy (production)

# 紹介サイトの本番（https://twitch-bot.fara-labs.com）への公開。master への push（develop → master の PR のマージ。ユーザーが行う。site/ などを変えたとき）で実行。
# 手動で再実行したいときは Actions タブから master を選んで Run workflow。
# 自分でビルドして公開する（成果物は使わない）。ビルドとテストは build.yml が同じ push で行う。
# kit の tools/maintenance.mjs（一括変更 CLI）は、この workflow の手動実行（workflow_dispatch の入力）を使う。

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "Manual.md"
      - "global.json"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/**"
      - ".gitmodules"
      - "external/fara-blazor-component"
  workflow_dispatch:
    inputs:
      skip_maintenance_check:
        description: "MAINTENANCE_MODE=notice の確認を飛ばして公開する（緊急の修正用。お知らせなしで公開され、メンテナンス画面にもならない）"
        type: boolean
        default: false
      maintenance_mode:
        description: "メンテナンス表示の切り替え。true = 全体メンテナンス（全ページがメンテナンス画面・503）、notice = お知らせ帯、false = 通常。空 = 変更しない"
        type: choice
        options: ["", "true", "notice", "false"]
        default: ""
      maintenance_message:
        description: "お知らせ・メンテナンス画面に出す文（200 文字まで・改行なし）。空 = 変更しない"
        type: string
        default: ""
      first_publish:
        description: "Worker がまだ無い初回の公開のときだけ true（MAINTENANCE_MODE の確認を、Worker が無いことに限って通す）。Worker 名・アカウント ID の誤りでも 404 になるので、通常は false のまま"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  # 公開の途中で中断すると、中途半端な状態になりうるので、後から来た分は待たせる（push の公開と、手動の maintenance_mode の実行が互いに取り消し合わない）
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (production)
    runs-on: ubuntu-latest
    # 手動実行で別のブランチを選んでも、本番には master だけを公開する
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://twitch-bot.fara-labs.com
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site (production)
        working-directory: site
        run: node tools/build-site.mjs --env production

      # 本番（master）の公開は、Cloudflare の Worker の変数 MAINTENANCE_MODE が notice（更新予定のお知らせを出している）のときだけ行う。
      # 確認できないとき・notice でないときは、ここで止める（手動実行の skip_maintenance_check で飛ばせる）。
      # mode に true / notice / false のどれかを指定した手動実行は、操作した人の意思なので、確認を飛ばす
      # お知らせの文は、Cloudflare の変数に入れる前に検査する（改行は表示を壊し、200 文字を超えると公開の途中で失敗するため）。
      # 空（変更しない）は通す。検査は deploy-develop.yml と同じ（.github/scripts/check-maintenance-message.mjs）
      - name: Validate maintenance_message
        env:
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
        run: node .github/scripts/check-maintenance-message.mjs

      - name: Require MAINTENANCE_MODE=notice (production)
        if: ${{ !contains(fromJSON('["true","notice","false"]'), inputs.maintenance_mode) }}
        run: node .github/scripts/require-maintenance.mjs fara-twitch-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          # 初回の公開（first_publish）のときだけ、Worker が無いことを通す（それ以外の 404 は止める）
          ALLOW_MISSING_WORKER: ${{ inputs.first_publish && '1' || '' }}

      # 入力はシェルに直接埋め込まず、環境変数で受ける。空の入力には --var を付けない（keep_vars で現在の値が保持される）。
      # mode を指定 → その値 / push と、何も指定しない手動実行 → 公開と同時に MAINTENANCE_MODE:true（メンテナンス画面。作業が終わったら
      # Cloudflare か Run workflow で false に戻す。skip_maintenance_check のときは付けない）/ message だけの手動実行 → MAINTENANCE_MODE は渡さない。
      # 最初に、ブランチの取り違えを止める（本番は master だけ）
      - name: Deploy to Cloudflare Workers
        shell: bash
        working-directory: site
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then echo "::error::production へは master からしか公開しません ($GITHUB_REF)"; exit 1; fi
          vars=()
          if [ -n "$MAINTENANCE_MODE_INPUT" ]; then
            vars+=(--var "MAINTENANCE_MODE:$MAINTENANCE_MODE_INPUT")
          elif [ -z "$MAINTENANCE_MESSAGE_INPUT" ] && [ "$SKIP_MAINTENANCE_CHECK" != "true" ]; then
            vars+=(--var "MAINTENANCE_MODE:true")
          fi
          if [ -n "$MAINTENANCE_MESSAGE_INPUT" ]; then vars+=(--var "MAINTENANCE_MESSAGE:$MAINTENANCE_MESSAGE_INPUT"); fi
          npx wrangler@4.149.0 deploy --env production "${vars[@]}"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          SKIP_MAINTENANCE_CHECK: ${{ inputs.skip_maintenance_check }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 公開の結果（設定した値と、反映後の現在値）をジョブサマリーに出す。公開が失敗したときも出す
      - name: Summary (maintenance)
        if: ${{ always() }}
        shell: bash
        run: |
          msg="$(printf '%s' "$MAINTENANCE_MESSAGE_INPUT" | tr '`' '"')"
          {
            echo "### メンテナンス表示 (${WORKER_NAME})"
            echo "- 設定した値: MAINTENANCE_MODE=\`${MAINTENANCE_MODE_INPUT:-(変更なし)}\` / MAINTENANCE_MESSAGE=\`${msg:-(変更なし)}\`"
            node -e '
              const j = (v) => JSON.stringify(v);
              fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}/settings`, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } })
                .then((r) => r.json())
                .then((b) => {
                  const list = b?.result?.bindings ?? [];
                  const v = (n) => { const x = list.find((y) => y.name === n); return x ? (x.type === "plain_text" ? j(x.text).replaceAll("`", "\u0027") : `(${x.type})`) : "(未設定)"; };
                  console.log(`- 反映後の現在値: MAINTENANCE_MODE=\`${v("MAINTENANCE_MODE")}\` / MAINTENANCE_MESSAGE=\`${v("MAINTENANCE_MESSAGE")}\``);
                })
                .catch(() => console.log("- 反映後の現在値: 取得できませんでした"));
            '
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MAINTENANCE_MODE_INPUT: ${{ inputs.maintenance_mode }}
          MAINTENANCE_MESSAGE_INPUT: ${{ inputs.maintenance_message }}
          WORKER_NAME: fara-twitch-bot
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
