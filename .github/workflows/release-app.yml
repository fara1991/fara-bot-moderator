name: Release (app installer)

# アプリ本体のインストーラーを作り、GitHub の Release に公開する。
# master への push（develop → master の PR のマージ）で動く。版は Installer/installer.iss の MyAppVersion。
# 版と同じタグ（v<版>）がすでにあるときは、新しく作らない（上書きしない）。バージョンを入れた手動実行でも動く（その場合は、同じタグがあっても、Release を作り直す）。
# master への PR では、アプリを変えたのに版が上がっていないものを、このワークフローで止める（version-check）。
# job を分けている。prepare（版の決定）→ build（ビルド・署名。書き込み権限なし。証明書を持つのはこの job だけ）→ release（タグと Release の作成。contents: write はこの job だけ）。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン (例: v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

# 実行が重なっても、途中で止めない（Release の作成の途中で止めると、タグだけ残るため）。順番に動かす。master への push と手動実行は、同じ group にまとめる（PR の確認は、PR ごと）
concurrency:
  group: release-app-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  version-check:
    name: Version bump check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # アプリを変えたのに、版（Installer/installer.iss の MyAppVersion）のタグがすでにあるときは、止める。
      # docs・tests・.github・.md だけの変更は、アプリの変更に数えない
      - name: Require a new version when the app changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          number=$(sed -n 's/^#define MyAppVersion "\([0-9][0-9.]*\)".*/\1/p' Installer/installer.iss | tr -d '\r' | head -n 1)
          if [ -z "$number" ]; then
            echo "::error::Installer/installer.iss から、MyAppVersion を読めませんでした。"
            exit 1
          fi
          tag="v$number"
          git fetch --tags --quiet
          exists=$(git tag --list "$tag")
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -v -E '^(docs/|tests/|\.github/)|\.md$' || true)
          if [ -n "$exists" ] && [ -n "$changed" ]; then
            echo "::error::アプリを変更していますが、版（$number）のリリース（$tag）がすでにあります。Installer/installer.iss の MyAppVersion と、Manual.md の更新履歴を上げてください。"
            exit 1
          fi
          echo "版 $number（タグ $tag: $([ -n "$exists" ] && echo あり || echo まだ無い)）。アプリの変更: $(printf '%s' "$changed" | grep -c . || true) ファイル"

  prepare:
    name: Decide version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
      release: ${{ steps.ver.outputs.RELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 入力は式展開でスクリプトに埋め込まず、環境変数で受ける（引用符を含む入力で、スクリプトを壊したり、命令を混ぜられないように）。
      # push（master）のときは、Installer/installer.iss の MyAppVersion から決める。同じタグがすでにあれば、Release は作らない。
      # 形式は vX.Y.Z（任意で -prerelease）だけを受ける
      - name: Decide the version and whether to release
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            number=$(sed -n 's/^#define MyAppVersion "\([0-9][0-9.]*\)".*/\1/p' Installer/installer.iss | tr -d '\r' | head -n 1)
            version="v$number"
          fi
          version=$(printf '%s' "$version" | tr -d '[:space:]')
          if ! [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::バージョンの形式が正しくありません（例: v1.0.0）: $version"
            exit 1
          fi
          if [[ "$version" != v* ]]; then
            version="v$version"
          fi
          release=true
          # タグが存在するか確認（公開リポジトリなので、認証なしで読める）。通信に失敗したら、ここで止まる（「タグが無い」と取り違えない）。手動実行は、同じタグがあっても作り直す
          remote_tag=$(git ls-remote --tags origin "refs/tags/$version")
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -n "$remote_tag" ]; then
            release=false
            echo "::notice::タグ $version はすでにあるので、Release は作りません（版を上げていません）。"
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE=$release" >> "$GITHUB_OUTPUT"
          echo "Version: $version (release: $release)"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    # 書き込み権限は持たない（ビルドのスクリプトや依存関係が、リポジトリに書き込めないように）
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      # 取得した認証情報（GITHUB_TOKEN）はディスクに残さない（以降のステップで使わない）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      # prepare で決めた版を、環境変数で受けて、形式をここでも検査する（vX.Y.Z、任意で -prerelease）
      - name: Set version
        id: version
        env:
          PREPARED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $version = "$env:PREPARED_VERSION".Trim()
          if ($version -notmatch '^v?\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Host "::error::バージョンの形式が正しくありません（例: v1.0.0）: $version"
            exit 1
          }
          # vプレフィックスがない場合は追加
          if (-not $version.StartsWith("v")) {
            $version = "v$version"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Restore dependencies
        run: dotnet restore

      # ステップの if では secrets を参照できないため、証明書の有無をこのステップの出力で判定する
      # (証明書を他のステップの環境に漏らさないよう、ジョブレベルの env には置かない)
      - name: Check signing certificate
        id: cert
        env:
          CERTIFICATE_PFX: ${{ secrets.CERTIFICATE_PFX }}
        run: |
          $hasCert = if ($env:CERTIFICATE_PFX) { "true" } else { "false" }
          echo "HAS_CERT=$hasCert" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Locate signtool
        if: steps.cert.outputs.HAS_CERT == 'true'
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found." }
          echo "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Publish
        run: |
          ./build_release.ps1 -PublishOnly
        shell: pwsh

      - name: Sign executable (self-signed)
        if: steps.cert.outputs.HAS_CERT == 'true'
        env:
          CERTIFICATE_PFX: ${{ secrets.CERTIFICATE_PFX }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          ./.github/scripts/sign.ps1 -Path "bin\Release\net10.0-windows10.0.22621.0\publish\win-x64\FaraBotModerator.exe"
        shell: pwsh

      - name: Package
        run: |
          ./build_release.ps1 -PackageOnly
        shell: pwsh

      - name: Sign installer (self-signed)
        if: steps.cert.outputs.HAS_CERT == 'true'
        env:
          CERTIFICATE_PFX: ${{ secrets.CERTIFICATE_PFX }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          ./.github/scripts/sign.ps1 -Path "Releases\FaraBotModerator_Setup.exe"
        shell: pwsh

      # 署名済みのインストーラーを、release の job へ渡す（build の成果物は、ここで作ったものだけ）
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Releases/FaraBotModerator_Setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    # タグの作成と、Release の作成に contents: write が要る（この job だけ）
    permissions:
      contents: write

    steps:
      # 認証情報はディスクに残さない（タグの作成は、下のステップで GH_TOKEN を明示して行う）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: Releases

      # master への push でも、手動実行でも、ビルドしたのと同じコミットにタグを付ける（Release の作成より前に、ここで作る）
      - name: Check and create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # タグが存在するか確認（公開リポジトリなので、認証なしで読める）
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists."
            exit 0
          fi
          # ビルドしたのと同じコミットに付ける
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"
          echo "Tag $VERSION created."

      # Release の本文を組み立てる。docs/release-notes/<タグ>.md があればそれを先頭にし、無ければ見出しだけにする。後ろに共通のインストール方法・必要条件を足す。
      # タグ名は式展開でスクリプトに埋め込まず、環境変数で受ける。ファイル名に使うので、形式（vX.Y.Z、任意で -prerelease）を、ここでも検査する
      - name: Build release body
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [[ "$VERSION" == *..* ]]; then
            echo "::error::バージョンの形式が正しくありません: $VERSION"
            exit 1
          fi
          notes="docs/release-notes/$VERSION.md"
          {
            if [ -f "$notes" ]; then
              cat "$notes"
              echo
            else
              echo "## FaraBotModerator $VERSION"
              echo
            fi
            cat <<'COMMON'
          ### インストール方法
          1. `FaraBotModerator_Setup.exe` をダウンロード
          2. インストーラーを実行
          3. 画面の指示に従ってインストール

          インストーラーは自己署名のため、Windows の SmartScreen の警告が出ることがあります。公式のこのページから入手したものであれば、「詳細情報」→「実行」で進めてください。

          ### 必要条件
          - Windows 10/11（x64）
          - WebView2 ランタイム（無ければインストーラーが入れます）

          .NET のランタイムは同梱されています。別にインストールする必要はありません。
          COMMON
          } > release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: FaraBotModerator ${{ needs.build.outputs.version }}
          body_path: release-body.md
          files: |
            Releases/FaraBotModerator_Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
